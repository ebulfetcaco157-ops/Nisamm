<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f6">
<title>Nisammm 🤍</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: grid; place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(145deg, #fffafd, #ffe5ef, #fff4f8);
    color: #98536f;
  }
  .card {
    position: relative; z-index: 2;
    width: min(90vw, 520px); padding: 42px 28px;
    text-align: center; border: 1px solid #ffffff;
    border-radius: 28px; background: rgba(255,255,255,.76);
    box-shadow: 0 18px 55px rgba(208, 116, 153, .16);
    animation: appear 1.2s ease both;
  }
  h1 { margin: 0 0 22px; color: #d8759c; font-size: clamp(32px, 8vw, 48px); }
  .heart { font-size: 30px; margin-bottom: 20px; animation: pulse 1.7s ease-in-out infinite; }
  p { font-size: clamp(18px, 4.5vw, 21px); line-height: 1.75; margin: 0; }
  .signature { margin-top: 24px; color: #d8759c; font-size: 24px; }
  .float {
    position: fixed; bottom: -50px; z-index: 1; pointer-events: none;
    color: #e78daf; opacity: .75; animation: floatUp linear forwards;
  }
  @keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    12% { opacity: .8; }
    to { transform: translateY(-115vh) rotate(35deg); opacity: 0; }
  }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  @keyframes appear {
    from { opacity: 0; transform: translateY(18px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="heart">🤍</div>
    <h1>Nisammm</h1>
    <p>
      Sen benim en sevdiğim, hayatımda tanıdığım en güzel,
      en sevimli, en sadık kızsın.<br>
      İyi ki seni tanıdım, iyi ki seni sevdim.
      Sonsuza kadar da seveceğim.
    </p>
    <div class="signature">Sonsuza kadar… ♡</div>
  </main>
<script>
  const symbols = ["♡", "🤍", "♥"];
  function makeHeart() {
    const item = document.createElement("span");
    item.className = "float";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (16 + Math.random() * 20) + "px";
    item.style.animationDuration = (6 + Math.random() * 5) + "s";
    document.body.appendChild(item);
    setTimeout(() => item.remove(), 11500);
  }
  setInterval(makeHeart, 550);
  for (let i = 0; i < 12; i++) setTimeout(makeHeart, i * 250);
</script>
</body>
</html>
